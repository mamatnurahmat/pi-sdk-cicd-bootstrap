# ============================================================================
# pi-sdk-cicd-bootstrap — Kubernetes manifest (contoh)
# ============================================================================
# Pola A: CronJob untuk dry-run/plan semua repo secara berkala (aman, tanpa LLM)
# Pola B: Job manual untuk bootstrap 1 repo (--dry-run true default)
#
# ⚠️ JANGAN apply langsung ke production — ini contoh. Sesuaikan namespace,
#    RBAC, dan secret sesuai environment.
#
# Apply:
#   kubectl apply -f k8s/00-secret.yaml -f k8s/10-rbac.yaml -f k8s/20-cronjob.yaml
# ============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: pi-cicd-bootstrap
  labels:
    app: pi-cicd-bootstrap
---
# ── Secret: auth model LLM + models.json (pi agent dir) ──────────────────
# Struktur ini = isi ~/.pi/agent/ yang dibutuhkan pi SDK di pod:
#   auth.json   → kredensial (API keys) — lihat ModelRuntime.create()
#   models.json → registri provider + model (custom/openrouter)
#   settings.json → defaultModel/defaultProvider/thinkingLevel
# Sumber lokal: ~/.pi/agent/{auth.json,models.json} (JANGAN commit plaintext).
apiVersion: v1
kind: Secret
metadata:
  name: pi-auth
  namespace: pi-cicd-bootstrap
type: Opaque
stringData:
  auth.json: |-
    {
      "OPENROUTER_API_KEY": "<isi-dari-~/.pi/agent/auth.json>"
    }
  models.json: |-
    {
      "providers": {
        "openrouter": {
          "apiKey": "<OPENROUTER_API_KEY>",
          "models": [
            { "id": "deepseek/deepseek-chat", "name": "DeepSeek V3", "reasoning": false, "input": ["text"], "contextWindow": 1000000, "maxTokens": 8192 },
            { "id": "deepseek/deepseek-r1", "name": "DeepSeek R1", "reasoning": true, "input": ["text"], "contextWindow": 1000000, "maxTokens": 8192 }
          ]
        }
      }
    }
  settings.json: |-
    {
      "defaultModel": "deepseek-v4-flash",
      "defaultProvider": "deepseek",
      "defaultThinkingLevel": "high"
    }
---
# ── Secret: kredensial eksekusi (git + kubectl) ──────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: pi-exec-creds
  namespace: pi-cicd-bootstrap
type: Opaque
stringData:
  # GitHub PAT dengan scope repo (untuk git clone/push + gh pr)
  GITHUB_TOKEN: "<PAT-repo-scope>"
  GITHUB_USER: "<username>"
  # kubeconfig context target (contoh hw-dev). Bisa juga via RBAC in-cluster.
  kubeconfig: |-
    apiVersion: v1
    kind: Config
    clusters: []
    users: []
---
# ── RBAC: izin baca/apply di namespace target (contoh develop-qoin) ──────
# Sesuaikan: untuk production jangan beri apply langsung (gunakan PR).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pi-cicd-bootstrap
  namespace: pi-cicd-bootstrap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pi-cicd-bootstrap
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "apply", "patch"]
  - apiGroups: [""]
    resources: ["services", "secrets", "configmaps"]
    verbs: ["get", "list", "apply", "create", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pi-cicd-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pi-cicd-bootstrap
subjects:
  - kind: ServiceAccount
    name: pi-cicd-bootstrap
    namespace: pi-cicd-bootstrap
---
# ── CronJob: dry-run plan semua repo (aman, tanpa LLM) ───────────────────
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pi-cicd-plan-daily
  namespace: pi-cicd-bootstrap
spec:
  schedule: "0 6 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: pi-cicd-bootstrap
          restartPolicy: Never
          containers:
            - name: bootstrap
              image: loyaltolpi/pi-sdk-cicd-bootstrap:latest
              imagePullPolicy: IfNotPresent
              args:
                - --repo
                - plus-be-merchantpg-manager
                - --branch
                - develop
                - --dry-run
                - "true"
              env:
                - name: HOME
                  value: /home/pi
                # Pi agent dir: mount auth.json/models.json/settings.json di sini
                - name: PI_AGENT_DIR
                  value: /etc/pi/agent
                - name: PI_AUTH_PATH
                  value: /etc/pi/agent/auth.json
                - name: PI_MODELS_PATH
                  value: /etc/pi/agent/models.json
              volumeMounts:
                - name: pi-auth
                  mountPath: /etc/pi/agent
                - name: pi-exec
                  mountPath: /etc/pi-exec
                  readOnly: true
                - name: kubeconfig
                  mountPath: /root/.kube
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
          volumes:
            - name: pi-auth
              secret:
                secretName: pi-auth
            - name: pi-exec
              secret:
                secretName: pi-exec-creds
            - name: kubeconfig
              secret:
                secretName: pi-exec-creds
                items:
                  - key: kubeconfig
                    path: config
